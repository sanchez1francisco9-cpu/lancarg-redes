<!doctype html><html><head><meta charset="utf-8"><style>
/* Portadas de destacadas, estilo principal: fondo blanco, ícono verde Lancarg con detalle rojo. Instagram recorta un círculo al centro. */
*{margin:0;padding:0;box-sizing:border-box}
body{background:#777}
.slide{width:1080px;height:1920px;background:#fff;position:relative;display:grid;place-items:center;margin-bottom:20px;overflow:hidden}
.ring{position:absolute;left:50%;top:50%;width:640px;height:640px;margin:-320px 0 0 -320px;border-radius:50%;border:14px solid #E70A0F}
.slide svg{width:400px;height:400px;position:relative}
.d{position:absolute;transform:skewX(-35deg)}
.tr1{right:-120px;top:-20px;width:260px;height:190px;background:#E70A0F}
.tr2{right:80px;top:-20px;width:100px;height:190px;border:4px solid #E70A0F;border-top:0;border-bottom:0}
.br1{right:-170px;bottom:-10px;width:470px;height:200px;background:#E70A0F}
.br2{right:260px;bottom:-10px;width:100px;height:200px;background:#02462D}
</style></head><body>
<!-- WhatsApp -->
<div class="slide"><div class="d tr1"></div><div class="d tr2"></div><div class="d br1"></div><div class="d br2"></div><div class="ring"></div>
  <svg viewBox="0 0 100 100">
    <path d="M50 12C28.5 12 11 28.6 11 49c0 7.6 2.4 14.6 6.6 20.4L12 88l19.4-5.3C37 85.8 43.3 87.6 50 87.6c21.5 0 39-16.6 39-38.3S71.5 12 50 12Z" fill="none" stroke="#02462D" stroke-width="7.5" stroke-linejoin="round"/>
    <path d="M38.2 32.5c1.4-.4 2.9.3 3.5 1.6l3.1 6.9c.5 1.2.2 2.5-.7 3.4l-2.6 2.4c1.9 4.3 5.4 7.9 9.7 9.9l2.5-2.6c.9-.9 2.3-1.2 3.4-.7l6.9 3c1.4.6 2.1 2.1 1.7 3.5l-1.2 4.2c-.5 1.6-2 2.7-3.7 2.6C46 70 30.6 54.6 29.6 39.6c-.1-1.7 1-3.2 2.6-3.7Z" fill="#E70A0F"/>
  </svg></div>
<!-- Horarios -->
<div class="slide"><div class="d tr1"></div><div class="d tr2"></div><div class="d br1"></div><div class="d br2"></div><div class="ring"></div>
  <svg viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="38" fill="none" stroke="#02462D" stroke-width="9"/>
    <path d="M50 28V50L64 60" fill="none" stroke="#E70A0F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="50" r="5" fill="#E70A0F"/>
  </svg></div>
<!-- Sucursales -->
<div class="slide"><div class="d tr1"></div><div class="d tr2"></div><div class="d br1"></div><div class="d br2"></div><div class="ring"></div>
  <svg viewBox="0 0 100 100">
    <path d="M50 8C33.4 8 20 21.2 20 37.6 20 60 50 92 50 92S80 60 80 37.6C80 21.2 66.6 8 50 8Z" fill="#02462D"/>
    <circle cx="50" cy="37.5" r="12.5" fill="#E70A0F"/>
  </svg></div>
</body></html>
