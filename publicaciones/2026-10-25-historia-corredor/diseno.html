<!doctype html><html><head><meta charset="utf-8"><style>
/* Historia 1080x1920 con el estilo "foto real unida al diseño" (aprobado por Fran). */
*{margin:0;padding:0;box-sizing:border-box}
body{background:#777;font-family:Inter,sans-serif}
.slide{width:1080px;height:1920px;position:relative;overflow:hidden;background:#fff;color:#02462D}
.photo{position:absolute;left:0;top:200px;width:1080px;height:1920px;object-fit:cover;
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,transparent 24%,rgba(0,0,0,.5) 31%,#000 38%);mask-image:linear-gradient(180deg,transparent 0%,transparent 24%,rgba(0,0,0,.5) 31%,#000 38%)}
.kick{position:absolute;left:50%;top:470px;transform:translateX(-50%);background:#E70A0F;color:#fff;font-weight:800;font-size:34px;letter-spacing:.12em;text-transform:uppercase;padding:12px 26px;border-radius:4px;white-space:nowrap}
.logo{position:absolute;left:50%;top:260px;width:560px;transform:translateX(-50%)}
h1{position:absolute;left:0;right:0;top:520px;text-align:center;font-family:"Inter Display",Inter;font-weight:900;font-size:112px;line-height:1;letter-spacing:-.025em;text-transform:uppercase}
h1 .r{color:#E70A0F}
.bar{position:absolute;left:50%;top:840px;width:140px;height:6px;background:#E70A0F;transform:translateX(-50%)}
.sub{position:absolute;left:0;right:0;top:805px;text-align:center;font-size:40px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#1d2b25}
.sub b{color:#E70A0F}
.line{position:absolute;top:580px;height:3px;background:#E70A0F;width:150px}
/* formas diagonales */
.d{position:absolute;transform:skewX(-35deg)}
.tr1{right:-120px;top:-20px;width:260px;height:190px;background:#E70A0F}
.tr2{right:80px;top:-20px;width:100px;height:190px;border:4px solid #E70A0F;border-top:0;border-bottom:0}
.br1{right:-170px;bottom:-10px;width:470px;height:200px;background:#E70A0F}
.br2{right:260px;bottom:-10px;width:100px;height:200px;background:#02462D}
.br3{right:420px;bottom:-10px;width:30px;height:200px;border-left:4px solid #E70A0F}
.blk{position:absolute;right:0;top:930px;width:280px;height:104px;background:#02462D;display:flex;align-items:center;padding-left:46px}
.blk::before{content:"";position:absolute;left:-60px;top:0;width:104px;height:104px;background:#02462D;transform:skewX(-35deg)}
.blk img{position:relative;height:74px}
.cta{position:absolute;right:50px;bottom:44px;text-align:right;color:#fff;font-weight:800;font-size:32px;line-height:1.25;z-index:2}
.cta small{display:block;font-size:26px;font-weight:600;opacity:.9}
</style></head><body>
<div class="slide">
  <img class="photo" src="../../fotos/vertical/camion-frente-izquierdo.jpg">
  <div class="d tr1"></div><div class="d tr2"></div>
  <img class="logo" src="../../marca/versiones/1-principal-color.png">
  <div class="kick">Nuestro corredor</div>
  <h1 style="font-size:84px;top:560px">Buenos Aires, Córdoba<br>y Rosario <span class="r">↔</span><br><span class="r">San Juan y Mendoza</span></h1>
  <div class="bar"></div>
  

  <div class="d br1"></div><div class="d br2"></div><div class="d br3"></div>
  <div class="cta"><small>Cotizá por WhatsApp</small>264 454-3612</div>
</div>
</body></html>
