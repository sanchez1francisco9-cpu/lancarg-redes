<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../plantillas/motion.css">
<style>
/* Reel: el camión de Lancarg avanza por una ruta vista desde arriba; la cámara lo sigue y van apareciendo los carteles.
   Idea adaptada (no copiada) de una referencia de otro transporte: textos y estilo propios. */
#road{background:#02462D}
#world{position:absolute;left:0;top:0;width:1080px;height:5800px;will-change:transform;overflow:visible}
#world svg{position:absolute;left:0;top:0}
.call{position:absolute;width:520px;color:#fff;opacity:0}
.call .t{font-family:"Inter Display",Inter;font-weight:900;font-size:58px;line-height:1.02;letter-spacing:-.015em;text-shadow:0 4px 18px rgba(0,0,0,.35)}
.call .t em{font-style:normal;color:#FFDE00}
.call .rule{height:6px;background:#fff;border-radius:3px;margin-top:22px;transform-origin:left}
.call .k{display:inline-grid;place-items:center;width:70px;height:70px;border-radius:50%;background:#E70A0F;font-family:"Inter Display",Inter;font-weight:900;font-size:42px;margin-bottom:18px;box-shadow:0 0 0 6px rgba(255,255,255,.18)}
.call .emo{font-size:.85em}
.call{width:560px}
.call.r{text-align:right}.call.r .rule{transform-origin:right}
.call.c{text-align:center}.call.c .rule{width:60%;margin-left:20%}
#hook{position:absolute;inset:0;padding:640px 70px 0;z-index:10;text-align:center;background:#fff;color:#02462D}
#hook h1 em{color:#E70A0F}
#hook h1{font-size:116px}
#hookLogo{width:860px;margin-top:70px}
#shadeTop{position:absolute;left:0;right:0;top:0;height:820px;background:linear-gradient(180deg,rgba(1,40,26,.85),rgba(1,40,26,0));z-index:7}
</style></head><body>
<div id="stage">
  <div class="scene" id="road" data-start="0" data-end="16.6">
    <div id="world">
      <svg width="1080" height="5800" viewBox="0 0 1080 5800">
        <!-- campos -->
        <g fill="#0a5a3a" opacity=".55">
          <path d="M-60 3900 C 180 3760 420 3900 380 4100 C 340 4300 60 4380 -60 4300Z"/>
          <path d="M1140 2500 C 900 2380 640 2500 690 2720 C 740 2930 1010 2960 1140 2880Z"/>
          <path d="M-60 1500 C 200 1420 400 1560 350 1760 C 300 1950 40 1980 -60 1900Z"/>
          <path d="M1140 4700 C 960 4640 760 4760 820 4930 C 880 5100 1060 5100 1140 5050Z"/>
        </g>
        <!-- banquina + asfalto + línea punteada -->
        <defs><path id="path" d="M540 5600 L540 5420 C 540 5000 250 4900 250 4520 S 830 3980 830 3600 S 250 3080 250 2700 S 540 2140 540 1800"/></defs>
        <use href="#path" fill="none" stroke="#1d7a52" stroke-width="290" stroke-linecap="round"/>
        <use href="#path" fill="none" stroke="#0e2a1f" stroke-width="240" stroke-linecap="round"/>
        <use href="#path" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="10" stroke-dasharray="60 55"/>
        <g id="trees" fill="#013322"></g>
        <!-- depósito Buenos Aires (inicio) -->
        <g transform="translate(540 5650)">
          <rect x="-230" y="0" width="460" height="150" rx="10" fill="#E8E2D2"/><rect x="-230" y="0" width="460" height="34" fill="#E70A0F"/>
          <text x="0" y="105" text-anchor="middle" font-family="Inter" font-weight="900" font-size="44" fill="#02462D">BUENOS AIRES</text>
        </g>
        <!-- casa del cliente (destino) -->
        <g transform="translate(540 1490)">
          <rect x="-150" y="-110" width="300" height="200" rx="8" fill="#E8E2D2"/>
          <path d="M-150 -110 L0 -10 L150 -110Z" fill="#cfc4ab"/><path d="M-150 90 L0 -10 L150 90Z" fill="#b9ad92"/>
          <rect x="-28" y="90" width="56" height="34" rx="4" fill="#E70A0F"/>
        </g>
        <image id="pkgEnd" href="../../fotos/recortes/caja-png-con-fondo-transparente-con-logo-lancarg.png" x="650" y="1600" width="150" height="172" opacity="0"/>
        <g id="pin" opacity="0"><path d="M0 0C-16 -21 -36 -38 -36 -62 -36 -82 -20 -98 0 -98 20 -98 36 -82 36 -62 36 -38 16 -21 0 0Z" fill="#E70A0F" stroke="#fff" stroke-width="6"/><circle cy="-62" r="13" fill="#fff"/></g>
        <!-- camión Lancarg visto desde arriba (mira hacia -y) -->
        <g id="truck">
          <ellipse cx="6" cy="16" rx="66" ry="182" fill="#000" opacity=".25"/>
          <rect x="-58" y="-60" width="116" height="230" rx="8" fill="#0b6b45"/>
          <g stroke="#0a5a3a" stroke-width="5"><line x1="-58" y1="-20" x2="58" y2="-20"/><line x1="-58" y1="25" x2="58" y2="25"/><line x1="-58" y1="70" x2="58" y2="70"/><line x1="-58" y1="115" x2="58" y2="115"/></g>
          <rect x="-58" y="160" width="116" height="10" fill="#E70A0F"/>
          <rect x="-52" y="-152" width="104" height="84" rx="18" fill="#ffffff"/>
          <rect x="-44" y="-150" width="88" height="22" rx="8" fill="#123a5a"/>
          <rect x="-52" y="-100" width="104" height="10" fill="#E70A0F"/>
        </g>
      </svg>
      <!-- carteles (textos de Fran); posición y momento los calcula el script según dónde frena el camión -->
      <div class="call" id="c1"><div class="k">1</div><div class="t">Gestionamos <em>toda la logística</em> <span class="emo">📞</span></div><div class="rule"></div></div>
      <div class="call" id="c2"><div class="k">2</div><div class="t">La retiramos o la entregás en <em>nuestra sucursal</em> <span class="emo">📦</span></div><div class="rule"></div></div>
      <div class="call" id="c3"><div class="k">3</div><div class="t">La transportamos en vehículos <em>propios y asegurados</em> <span class="emo">🚚</span></div><div class="rule"></div></div>
      <div class="call" id="c4"><div class="k">4</div><div class="t">Al llegar, realizamos la <em>entrega a domicilio</em> <span class="emo">🚪</span></div><div class="rule"></div></div>
    </div>
    <div id="shadeTop"></div>
    <div id="hook"><h1 data-in="0.3">Así viaja <em>tu mercadería</em> con:</h1><img id="hookLogo" data-in="0.8" src="../../marca/logo-lancarg-color-transparente.png"></div>
  </div>
  <div class="scene end white" id="fin" data-start="16.6" data-end="21.95" data-nologo>
    <div class="spacer"></div>
    <h2 data-in="1.8">Cotizá <em>tu envío</em></h2>
    <div class="pill" data-in="2.2"><span style="font-size:60px">📲</span><span>Escribinos por WhatsApp<small>264 454-3612</small></span></div>
  </div>
  <img id="toplogo" src="../../marca/logo-lancarg-sobre-verde.png" style="z-index:9">
</div>
<script>
window.OVERLAY = [{src: "../../marca/logo-lancarg-animado-horizontal.mp4", start: 16.95, x: 0, y: 563, w: 1080}];
// árboles: grupos de círculos a los costados de la ruta (posiciones fijas para que el video sea reproducible)
const T = [[110,5050],[950,4400],[90,3500],[980,3150],[120,2300],[960,1950],[100,1400],[990,700],[150,600],[930,5250],[610,4150],[470,3300],[640,2350],[440,1500]];
const tg = document.getElementById('trees');
T.forEach(([x, y]) => [[0,0,46],[38,-22,34],[-34,-18,30],[10,30,32]].forEach(([dx, dy, r]) => {
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); c.setAttribute('cx', x + dx); c.setAttribute('cy', y + dy); c.setAttribute('r', r); tg.appendChild(c);
}));
const path = document.getElementById('path'), L = path.getTotalLength(), S0 = 180;   // la ruta sigue debajo del depósito
// frena en las curvas (ahí queda espacio libre al costado para el cartel) y al final en la casa
function fracAtY(y) { let best = 0, bd = 1e9; for (let l = S0; l <= L; l += 4) { const d = Math.abs(path.getPointAtLength(l).y - y); if (d < bd) { bd = d; best = l; } } return (best - S0) / (L - S0); }
const STOPS = [fracAtY(4520), fracAtY(3600), fracAtY(2700), 1.0];
const START = 3.0, SPEED = 720, WAIT = 2.8; // sale después del título; px/s; segundos parado en cada cartel
// arma la línea de tiempo: [tSalida, tLlegada, fDesde, fHasta] por tramo
const SEG = []; let tt = START, ff = 0;
// los 4 tramos de ruta tienen el mismo largo, así el camión tarda lo mismo entre carteles
STOPS.forEach((fr, i) => { let d = (fr - ff) * (L - S0) / SPEED; SEG.push([tt, tt + d, ff, fr]); tt += d + WAIT; ff = fr; });
const ARRIVE = SEG[SEG.length - 1][1], END = ARRIVE + WAIT;
const sm = x => x * x * (3 - 2 * x);         // arranca y frena suave
function progress(t) {
  let f = 0;
  for (const [a, b, f0, f1] of SEG) { if (t >= b) f = f1; else if (t > a) { f = f0 + (f1 - f0) * sm((t - a) / (b - a)); break; } else break; }
  return f;
}
// coloca cada cartel al costado del camión, del lado libre de la ruta
const pt = fr => path.getPointAtLength(S0 + (L - S0) * fr);
STOPS.forEach((fr, i) => {
  const p = pt(fr), el = document.getElementById('c' + (i + 1)), right = p.x < 540 || i === 3;
  el.classList.add(right ? 'l' : 'r');
  el.style.left = (right ? 470 : 70) + 'px';
  el.style.top = (p.y - 330) + 'px';
  if (i === 3) {                              // el último va centrado arriba de la casa
    el.className = 'call c'; el.style.left = '90px'; el.style.width = '900px'; el.style.top = (p.y - 850) + 'px';
  }
});
// duración de escenas según la línea de tiempo
document.getElementById('road').dataset.end = END.toFixed(2);
const fin = document.getElementById('fin'); fin.dataset.start = END.toFixed(2); fin.dataset.end = (END + 5.35).toFixed(2);
window.OVERLAY[0].start = +(END + 0.35).toFixed(2);
window.extra = function (t) {
  const f = progress(t), s = S0 + (L - S0) * f;
  const p = path.getPointAtLength(s), q = path.getPointAtLength(Math.max(0, s - 4));
  const ang = Math.atan2(p.y - q.y, p.x - q.x) * 180 / Math.PI + 90;
  document.getElementById('truck').setAttribute('transform', `translate(${p.x} ${p.y}) rotate(${ang}) scale(1.15)`);
  const cam = Math.min(5800 - 1920, Math.max(-520, p.y - 1920 * 0.64));
  document.getElementById('world').style.transform = `translateY(${-cam}px)`;
  SEG.forEach(([a, b], i) => {               // cada cartel aparece al frenar y queda en su lugar
    const next = SEG[i + 1] ? SEG[i + 1][0] : 1e9;   // se va cuando el camión vuelve a arrancar
    const k = cl((t - b + 0.15) / 0.45) * (1 - cl((t - next - 0.6) / 0.4)), el = document.getElementById('c' + (i + 1));
    el.style.opacity = k; el.style.transform = `translateY(${(1 - eo(k)) * 50}px) scale(${0.94 + 0.06 * eo(k)})`;
    el.querySelector('.rule').style.transform = `scaleX(${eo(cl((t - b - 0.2) / 0.5))})`;
  });
  const hk = 1 - cl((t - START + 0.2) / 0.4);
  document.getElementById('hook').style.opacity = hk;
  document.getElementById('shadeTop').style.opacity = 0.45 + 0.55 * hk;
  document.getElementById('toplogo').style.visibility = hk > 0.5 ? 'hidden' : 'visible';
  const a = eo((t - ARRIVE) / 0.6), pin = document.getElementById('pin');
  pin.setAttribute('opacity', cl((t - ARRIVE) / 0.15)); pin.setAttribute('transform', `translate(700 ${1585 - (1 - a) * 120})`);
  document.getElementById('pkgEnd').setAttribute('opacity', cl((t - ARRIVE - 0.3) / 0.3));
};
</script>
<script src="../../plantillas/motion.js"></script>
</body></html>
