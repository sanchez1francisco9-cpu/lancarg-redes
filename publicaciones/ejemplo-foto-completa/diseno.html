<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#777;font-family:Inter,sans-serif}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;margin-bottom:20px;background:#5d86b8}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;left:0;right:0;top:0;height:640px;background:linear-gradient(180deg,rgba(10,30,50,.38),rgba(10,30,50,.18) 55%,transparent)}
.tab{position:absolute;left:50%;top:0;transform:translateX(-50%);background:#fff;border-radius:0 0 36px 36px;padding:26px 54px 22px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.tab img{width:300px;display:block}
.c{position:absolute;left:0;right:0;text-align:center;color:#fff}
h1{font-family:"Inter Display",Inter;font-weight:900;font-size:132px;line-height:.92;letter-spacing:-.035em;text-transform:uppercase;text-shadow:0 6px 30px rgba(0,0,0,.25)}
h2{font-family:"Inter Display",Inter;font-weight:500;font-size:56px;letter-spacing:-.01em;margin-top:14px;text-shadow:0 4px 20px rgba(0,0,0,.3)}
.line{width:300px;height:5px;background:#fff;margin:26px auto 24px;border-radius:3px}
.box{display:inline-block;background:#E70A0F;color:#fff;font-weight:800;font-style:italic;font-size:52px;padding:6px 26px 10px;letter-spacing:-.01em}
.cta{position:absolute;right:46px;bottom:40px;text-align:right;color:#fff;font-weight:800;font-size:36px;line-height:1.2;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.cta small{display:block;font-size:24px;font-weight:600}
</style></head><body>
<div class="slide">
  <img class="photo" src="../../fotos/camion-scania-lancarg-bajo-cielo-azul.jpg" style="object-position:50% 0%">
  <div class="shade"></div>
  <div class="tab"><img src="../../marca/versiones/1-principal-color.png"></div>
  <div class="c" style="top:185px">
    <h1>Crecemos</h1>
    <h2>para llegar más lejos</h2>
    <div class="line"></div>
    <div class="box">Flota propia y moderna</div>
  </div>
  <div class="cta"><small>Cotizá por WhatsApp</small>264 454-3612</div>
</div>
</body></html>
