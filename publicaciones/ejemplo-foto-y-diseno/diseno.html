<!doctype html><html><head><meta charset="utf-8"><style>
/* Ejemplo de estilo "foto real unida al diseño" (feed 1080x1350). */
*{margin:0;padding:0;box-sizing:border-box}
body{background:#777;font-family:Inter,sans-serif}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:#fff;color:#02462D}
.photo{position:absolute;left:0;top:560px;width:1080px;height:810px;object-fit:cover;object-position:50% 70%;
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.35) 14%,#000 34%);mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.35) 14%,#000 34%)}
.logo{position:absolute;left:50%;top:70px;width:470px;transform:translateX(-50%)}
h1{position:absolute;left:0;right:0;top:250px;text-align:center;font-family:"Inter Display",Inter;font-weight:900;font-size:104px;line-height:1;letter-spacing:-.025em;text-transform:uppercase}
h1 .r{color:#E70A0F}
.bar{position:absolute;left:50%;top:470px;width:140px;height:6px;background:#E70A0F;transform:translateX(-50%)}
.sub{position:absolute;left:0;right:0;top:500px;text-align:center;font-size:40px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#1d2b25}
.sub b{color:#E70A0F}
.line{position:absolute;top:580px;height:3px;background:#E70A0F;width:150px}
/* formas diagonales */
.d{position:absolute;transform:skewX(-35deg)}
.tr1{right:-120px;top:-20px;width:230px;height:150px;background:#E70A0F}
.tr2{right:60px;top:-20px;width:90px;height:150px;border:4px solid #E70A0F;border-top:0;border-bottom:0}
.br1{right:-170px;bottom:-10px;width:470px;height:200px;background:#E70A0F}
.br2{right:260px;bottom:-10px;width:100px;height:200px;background:#02462D}
.br3{right:420px;bottom:-10px;width:30px;height:200px;border-left:4px solid #E70A0F}
.blk{position:absolute;right:0;top:600px;width:280px;height:104px;background:#02462D;display:flex;align-items:center;padding-left:46px}
.blk::before{content:"";position:absolute;left:-60px;top:0;width:104px;height:104px;background:#02462D;transform:skewX(-35deg)}
.blk img{position:relative;height:74px}
.cta{position:absolute;right:46px;bottom:40px;text-align:right;color:#fff;font-weight:800;font-size:32px;line-height:1.25;z-index:2}
.cta small{display:block;font-size:26px;font-weight:600;opacity:.9}
</style></head><body>
<div class="slide">
  <img class="photo" src="../../fotos/tres-camiones-lancarg-en-el-patio-logistico.jpg">
  <div class="d tr1"></div><div class="d tr2"></div>
  <img class="logo" src="../../marca/versiones/1-principal-color.png">
  <h1>Buenos Aires <span class="r">↔</span><br>San Juan</h1>
  <div class="bar"></div>
  <div class="sub">Camiones <b>todos los días</b></div>
  <div class="blk"></div>
  <div class="d br1"></div><div class="d br2"></div><div class="d br3"></div>
  <div class="cta"><small>Cotizá por WhatsApp</small>264 454-3612</div>
</div>
</body></html>
