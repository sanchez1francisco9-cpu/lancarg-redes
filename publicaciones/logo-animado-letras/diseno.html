<!doctype html><html><head><meta charset="utf-8">
<style>
/* Animación del logo: un punto rebota, se hace palo de la "L" y las letras salen volando en arco hasta formar "Lancarg";
   después aparece el logo real. Fondo que parpadea en los colores de Lancarg. Idea adaptada de una referencia. */
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;background:#fff;font-family:"Inter Display",Inter,sans-serif}
#word{position:absolute;left:0;right:0;top:880px;text-align:center;font-weight:900;font-style:italic;font-size:230px;letter-spacing:-.02em;line-height:1;visibility:hidden;white-space:nowrap}
.l{position:absolute;top:0;left:0;font-weight:900;font-style:italic;font-size:230px;line-height:1;letter-spacing:-.02em;transform-origin:50% 60%;will-change:transform}
#dot{position:absolute;width:34px;height:34px;border-radius:50%}
#logo{position:absolute;left:90px;width:900px;top:700px;opacity:0}
</style></head><body>
<div id="stage">
  <div id="word"></div>
  <div id="dot"></div>
  <img id="logo" src="../../marca/versiones/1-principal-color.png">
</div>
<script>
const R = '#E70A0F', G = '#02462D', W = '#fff';
const cl = x => Math.max(0, Math.min(1, x)), eo = x => 1 - Math.pow(1 - cl(x), 3);
const eb = x => { x = cl(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }; // con rebote
const TXT = 'Lancarg', st = document.getElementById('stage'), word = document.getElementById('word');
// posiciones finales de cada letra
word.innerHTML = [...TXT].map(c => `<span>${c}</span>`).join('');
const fin = [...word.children].map(s => ({ x: s.offsetLeft, y: word.offsetTop, w: s.offsetWidth }));
const L = [...TXT].map((c, i) => { const d = document.createElement('div'); d.className = 'l'; d.textContent = c; st.appendChild(d); return d; });
const dot = document.getElementById('dot'), logo = document.getElementById('logo');
const OX = fin[0].x + fin[0].w * 0.45, OY = fin[0].y + 150; // origen: donde queda la "L"
// fondo: parpadea rojo / blanco / verde y termina en blanco
const FL = [[0, W], [0.25, R], [0.55, W], [0.8, R], [1.1, W], [1.35, G], [1.65, R], [2.3, W]];
const bgAt = t => { let c = W; FL.forEach(([a, k]) => { if (t >= a) c = k; }); return c; };
window.DURATION = 6.2;
window.render = function (t) {
  const bg = bgAt(t); st.style.background = bg;
  const fg = bg === W ? R : W;
  // 1. punto que cae, rebota y se estira como el palo de la L
  const pd = eb((t - 0.15) / 0.6);
  const dy = OY - 600 * (1 - pd), stretch = 1 + 3 * cl((t - 0.9) / 0.35);
  dot.style.background = fg;
  dot.style.left = (OX - 17) + 'px'; dot.style.top = (dy - 17) + 'px';
  dot.style.transform = `rotate(${(t > 1.25 ? (t - 1.25) * 720 : 0)}deg) scale(1,${stretch})`;
  dot.style.opacity = t > 0.15 && t < 1.75 ? 1 : 0;
  // 2. las letras salen en arco desde el punto, girando, y se acomodan
  L.forEach((d, i) => {
    const a = 1.5 + i * 0.13, p = cl((t - a) / 0.85), e = eo(p), k = eb(p);
    const sx = OX - fin[i].w / 2, sy = OY - 120, ex = fin[i].x, ey = fin[i].y;
    const cx = (sx + ex) / 2, cy = Math.min(sy, ey) - 760 + i * 40; // punto alto del arco
    const x = (1 - e) * (1 - e) * sx + 2 * (1 - e) * e * cx + e * e * ex;
    const y = (1 - e) * (1 - e) * sy + 2 * (1 - e) * e * cy + e * e * ey;
    const s = 0.2 + 0.8 * k, rot = (1 - k) * (i % 2 ? 260 : -260);
    d.style.transform = `translate(${x}px,${y}px) rotate(${rot}deg) scale(${s})`;
    d.style.color = fg; d.style.opacity = t < a ? 0 : 1 - cl((t - 3.5) / 0.35);
    d.style.filter = p > 0 && p < 0.7 ? `blur(${(1 - p) * 4}px)` : 'none';
  });
  // 3. aparece el logo real
  const q = eo((t - 3.45) / 0.6);
  logo.style.opacity = q; logo.style.transform = `scale(${0.92 + 0.08 * q}) translateX(${(1 - q) * -40}px)`;
};
window.addEventListener('load', () => render(0));
</script>
</body></html>
