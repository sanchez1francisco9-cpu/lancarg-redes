<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#777}
.slide{width:1080px;height:1920px;background:#02462D;display:grid;place-items:center;margin-bottom:20px}
.slide svg{width:420px;height:420px}
</style></head><body>
<!-- Sucursales: pin de ubicación blanco con centro rojo, centrado (Instagram recorta un círculo al medio) -->
<div class="slide" id="sucursales">
  <svg viewBox="0 0 100 100">
    <path d="M50 8C33.4 8 20 21.2 20 37.6 20 60 50 92 50 92S80 60 80 37.6C80 21.2 66.6 8 50 8Z" fill="#fff"/>
    <circle cx="50" cy="37.5" r="12.5" fill="#E70A0F"/>
  </svg>
</div>
<!-- Horarios: reloj blanco con agujas rojas, mismo estilo -->
<div class="slide" id="horarios">
  <svg viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="38" fill="none" stroke="#fff" stroke-width="9"/>
    <path d="M50 28V50L64 60" fill="none" stroke="#E70A0F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="50" r="5" fill="#E70A0F"/>
  </svg>
</div>
<!-- WhatsApp / atención: globo de chat blanco con tubo de teléfono rojo, mismo estilo -->
<div class="slide" id="whatsapp">
  <svg viewBox="0 0 100 100">
    <path d="M50 12C28.5 12 11 28.6 11 49c0 7.6 2.4 14.6 6.6 20.4L12 88l19.4-5.3C37 85.8 43.3 87.6 50 87.6c21.5 0 39-16.6 39-38.3S71.5 12 50 12Z" fill="none" stroke="#fff" stroke-width="7.5" stroke-linejoin="round"/>
    <path d="M38.2 32.5c1.4-.4 2.9.3 3.5 1.6l3.1 6.9c.5 1.2.2 2.5-.7 3.4l-2.6 2.4c1.9 4.3 5.4 7.9 9.7 9.9l2.5-2.6c.9-.9 2.3-1.2 3.4-.7l6.9 3c1.4.6 2.1 2.1 1.7 3.5l-1.2 4.2c-.5 1.6-2 2.7-3.7 2.6C46 70 30.6 54.6 29.6 39.6c-.1-1.7 1-3.2 2.6-3.7Z" fill="#E70A0F"/>
  </svg>
</div>
</body></html>
