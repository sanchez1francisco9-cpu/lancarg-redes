<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--g:#02462D;--g2:#013322;--r:#E70A0F;--w:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#888;font-family:Inter,sans-serif}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;color:var(--w);margin-bottom:20px}
.logo{position:absolute;top:60px;left:60px;width:400px;filter:drop-shadow(0 3px 10px rgba(0,0,0,.55));z-index:5}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* 1 */
#s1 .bg{object-position:50% 40%}
#s1 .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(1,40,26,.92) 0%,rgba(1,40,26,.6) 13%,rgba(1,40,26,0) 27%,rgba(1,40,26,0) 42%,rgba(1,51,34,.92) 70%,var(--g2) 100%)}
#s1 .txt{position:absolute;left:72px;right:72px;bottom:96px}
.kicker{display:inline-block;background:var(--r);font-weight:800;font-size:30px;letter-spacing:.06em;text-transform:uppercase;padding:12px 22px;border-radius:6px;margin-bottom:30px}
h1{font-family:"Inter Display",Inter;font-weight:900;font-size:104px;line-height:.98;letter-spacing:-.02em}
h1 em{font-style:normal;color:#7fd3a6}
.sub{display:flex;align-items:center;gap:22px;margin-top:38px;font-size:44px;font-weight:500}
.arrow{width:76px;height:76px;border-radius:50%;background:var(--w);color:var(--g);display:grid;place-items:center;font-size:44px;font-weight:900}

/* 2 */
#s2{background:var(--g)}
#s2 .photo{position:absolute;left:0;right:0;bottom:0;height:610px}
#s2 .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 60%}
#s2 .photo:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--g) 0%,rgba(2,70,45,0) 35%);z-index:1}
#s2 .txt{position:absolute;top:200px;left:72px;right:72px}
.year{font-family:"Inter Display";font-weight:900;font-size:200px;line-height:.85;letter-spacing:-.04em;color:var(--w)}
.year small{display:block;font-size:46px;font-weight:600;letter-spacing:0;color:#9fdcbb;margin-bottom:14px}
.list{margin-top:56px;display:flex;flex-direction:column;gap:26px}
.li{display:flex;align-items:center;gap:24px;font-size:42px;font-weight:600}
.dot{flex:none;width:52px;height:52px;border-radius:50%;background:var(--r);display:grid;place-items:center;font-size:30px;font-weight:900}

/* 3 */
#s3{background:var(--g2)}
#s3 .bg{height:830px;object-position:50% 50%}
#s3 .fade{position:absolute;left:0;right:0;top:560px;height:280px;background:linear-gradient(180deg,rgba(1,51,34,0),var(--g2))}
#s3 .txt{position:absolute;left:72px;right:72px;top:700px}
#s3 h1{font-size:120px}
.cta{display:inline-flex;align-items:center;gap:20px;margin-top:44px;background:var(--w);color:var(--g);font-weight:800;font-size:44px;padding:26px 44px;border-radius:999px}
.cta i{font-style:normal;color:var(--r)}
.foot{position:absolute;left:72px;right:72px;bottom:60px;display:flex;justify-content:space-between;align-items:flex-end;font-size:28px;font-weight:600;color:#9fdcbb;letter-spacing:.04em}
.foot img{width:300px}
</style></head><body>

<div class="slide" id="s1">
  <img class="bg" src="../../fotos/camion-scania-al-atardecer-entre-montanas.jpg">
  <div class="shade"></div>
  <img class="logo" src="../../marca/logo-lancarg-sobre-verde.png">
  <div class="txt">
    <div class="kicker">Buenos Aires ↔ San Juan</div>
    <h1>¿Tenés que traer <em>algo?</em></h1>
    <div class="sub"><span class="arrow">→</span>Nosotros nos encargamos.</div>
  </div>
</div>

<div class="slide" id="s2">
  <img class="logo" src="../../marca/logo-lancarg-sobre-verde.png">
  <div class="txt">
    <div class="year"><small>En la ruta desde</small>1957</div>
    <div class="list">
      <div class="li"><span class="dot">✓</span>Camiones todos los días</div>
      <div class="li"><span class="dot">✓</span>Retiro a domicilio y entrega en destino</div>
      <div class="li"><span class="dot">✓</span>Carga asegurada</div>
    </div>
  </div>
  <div class="photo"><img src="../../fotos/tres-camiones-lancarg-en-el-patio-logistico.jpg"></div>
</div>

<div class="slide" id="s3">
  <img class="bg" src="../../fotos/caja-de-carton-con-logo-de-transporte-lancarg.jpg">
  <div class="fade"></div>
  <div class="txt">
    <h1>Cotizá tu envío hoy.</h1><div style="font-size:40px;font-weight:500;margin-top:18px;color:#cdebd9">Desde un paquete hasta tu stock completo.</div>
    <div class="cta"><svg width="46" height="46" viewBox="0 0 24 24" fill="#25D366"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.4z"/></svg>264 454-3612</div>
  </div>
  <div class="foot"><span>ENCOMIENDAS · CARGAS · PALLETS</span><img src="../../marca/logo-lancarg-sobre-verde.png"></div>
</div>

</body></html>
