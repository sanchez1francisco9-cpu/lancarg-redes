<!doctype html><html><head><meta charset="utf-8"><style>
:root{--g:#02462D;--g2:#013322;--r:#E70A0F}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:Inter,sans-serif;color:#fff}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--g2)}
.scene{position:absolute;inset:0;opacity:0;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 45%}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(1,40,26,.9) 0%,rgba(1,40,26,.45) 14%,rgba(1,40,26,0) 28%,rgba(1,40,26,0) 42%,rgba(1,51,34,.92) 64%,var(--g2) 100%)}
.logo{position:absolute;top:140px;left:70px;width:420px;filter:drop-shadow(0 3px 10px rgba(0,0,0,.55));z-index:9}
.txt{position:absolute;left:76px;right:120px;top:1080px}
.kicker{display:inline-block;background:var(--r);font-weight:800;font-size:34px;letter-spacing:.06em;text-transform:uppercase;padding:12px 24px;border-radius:6px;margin-bottom:30px}
h1{font-family:"Inter Display",Inter;font-weight:900;font-size:118px;line-height:.98;letter-spacing:-.02em}
h1 em{font-style:normal;color:#7fd3a6}
.route{margin-top:40px;font-size:54px;font-weight:800;display:flex;align-items:center;gap:22px}
.route .arr{color:var(--r);font-size:66px}
.li{display:flex;align-items:center;gap:28px;font-size:56px;font-weight:700;margin-top:34px}
.dot{flex:none;width:72px;height:72px;border-radius:50%;background:var(--r);display:grid;place-items:center;font-size:40px}
.pkg{position:absolute;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))}
.green{background:radial-gradient(ellipse at 50% 35%,#05603e 0%,var(--g) 45%,var(--g2) 100%)}
.end{display:flex;flex-direction:column;align-items:center;text-align:center}
.end .biglogo{width:760px;margin-top:520px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.5))}
.end h2{font-family:"Inter Display",Inter;font-weight:900;font-size:92px;line-height:1;margin-top:60px}
.pill{display:inline-flex;align-items:center;gap:22px;margin-top:70px;background:#fff;color:var(--g);font-weight:800;font-size:52px;padding:30px 50px;border-radius:999px}
.pill small{display:block;font-size:34px;font-weight:700;color:#3c6f58}
</style></head><body>
<div id="stage">
  <!-- 1: depósito Buenos Aires -->
  <div class="scene" id="s1">
    <img class="bg" src="../../fotos/vertical/interior-deposito-bsas-con-mucha-mercaderia.jpg">
    <div class="shade"></div>
    <div class="txt"><div class="kicker" data-in="0.3">Comercios y particulares</div>
      <h1 data-in="0.5">¿Comprás en <em>Buenos Aires</em>?</h1></div>
  </div>
  <!-- 2: paquetes volando -->
  <div class="scene green" id="s2">
    <img class="pkg" id="p1" src="../../fotos/recortes/caja-png-con-fondo-transparente-con-logo-lancarg.png" style="width:520px">
    <img class="pkg" id="p2" src="../../fotos/recortes/caja-abierta-png-con-logo-lancarg-fondo-transparente.png" style="width:440px">
    <img class="pkg" id="p3" src="../../fotos/recortes/cajas-de-transporte-apiladas-con-logo-fondo-transparente.png" style="width:470px">
    <div class="txt" style="top:1130px"><h1 data-in="0.35">Traé tus paquetes a <em style="white-space:nowrap">San Juan</em></h1>
      <div class="route" data-in="0.8">Buenos Aires <span class="arr">↔</span> San Juan</div></div>
  </div>
  <!-- 3: camión en ruta + beneficios -->
  <div class="scene" id="s3">
    <img class="bg" src="../../fotos/vertical/scania-cruzando-el-desierto.jpg">
    <div class="shade" style="background:linear-gradient(180deg,rgba(1,40,26,.92) 0%,rgba(1,40,26,.75) 30%,rgba(1,40,26,0) 50%)"></div>
    <div class="txt" style="top:380px">
      <div class="li" data-in="0.3"><span class="dot">🚛</span>Camiones todos los días</div>
      <div class="li" data-in="0.75"><span class="dot">📦</span>Retiro a domicilio</div>
      <div class="li" data-in="1.2"><span class="dot">🛡️</span>Carga asegurada</div>
    </div>
  </div>
  <!-- 4: cierre -->
  <div class="scene green end" id="s4">
    <img class="biglogo" data-in="0.15" src="../../marca/logo-lancarg-sobre-verde.png">
    <h2 data-in="0.5">En la ruta<br>desde 1957</h2>
    <div class="pill" data-in="0.9"><span style="font-size:60px">📲</span><span>Cotizá por WhatsApp<small>264 454-3612</small></span></div>
  </div>
  <img class="logo" id="toplogo" src="../../marca/logo-lancarg-sobre-verde.png">
</div>
<script>
const SC=[["s1",0,3.4],["s2",3.4,6.8],["s3",6.8,10.2],["s4",10.2,14]];
window.DURATION=14;
const cl=x=>Math.max(0,Math.min(1,x)), eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const F=0.35; // cross-fade
window.render=function(t){
  SC.forEach(([id,a,b],i)=>{
    const el=document.getElementById(id), lt=t-a, d=b-a;
    let o = i===0 ? 1 : cl((t-a)/F);
    // la escena anterior queda opaca debajo mientras la siguiente aparece encima
    el.style.opacity = (t<a-0.001||t>b+F)?0:o;
    const bg=el.querySelector('.bg');
    if(bg){const k=cl(lt/(d+F)); bg.style.transform=`scale(${1.04+0.1*k}) translateY(${-20*k}px)`;}
    el.querySelectorAll('[data-in]').forEach(n=>{
      const p=eo(cl((lt-parseFloat(n.dataset.in))/0.55));
      n.style.opacity=p; n.style.transform=`translateY(${(1-p)*80}px)`;
    });
  });
  // paquetes de la escena 2 entran volando y quedan flotando
  const lt=t-3.4, f=(d)=>eo(cl((lt-d)/0.8)), fl=(ph)=>Math.sin((t+ph)*2.2)*14;
  const P=[["p1",0.0,-560,90,330,-18,-8],["p2",0.2,1140,560,300,24,10],["p3",0.4,-500,330,640,-30,3]];
  // [id, delay, xStart, xEnd, y, rotStart, rotEnd]
  P.forEach(([id,dl,x0,x1,y,r0,r1],i)=>{
    const p=f(dl), el=document.getElementById(id);
    el.style.left=(x0+(x1-x0)*p)+'px'; el.style.top=(y+fl(i*1.3))+'px';
    el.style.transform=`rotate(${r0+(r1-r0)*p}deg)`;
  });
  // logo chico arriba: visible salvo en el cierre (ahí va grande)
  document.getElementById('toplogo').style.opacity = 1-cl((t-10.2)/F);
};
render(0);
</script>
</body></html>
