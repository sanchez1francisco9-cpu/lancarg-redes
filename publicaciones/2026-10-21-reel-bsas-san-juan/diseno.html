<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../plantillas/motion.css">
<style>
.logowrap{position:relative;width:760px;height:222px;margin-top:820px}
.logowrap img{position:absolute;left:0;top:0;width:100%;filter:drop-shadow(0 4px 14px rgba(0,0,0,.5))}
#lgTruck{clip-path:inset(0 0 0 76%)}
</style>
</head><body>
<div id="stage">
  <div class="scene" id="s1" data-start="0" data-end="3.4">
    <img class="bg" src="../../fotos/vertical/interior-deposito-bsas-con-mucha-mercaderia.jpg"><div class="shade"></div>
    <div class="txt"><div class="kicker" data-in="0.3">Comercios y particulares</div>
      <h1 data-in="0.5">¿Comprás en <em>Buenos Aires</em>?</h1></div>
  </div>
  <div class="scene green" id="s2" data-start="3.4" data-end="6.8">
    <img class="pkg" id="p1" src="../../fotos/recortes/caja-png-con-fondo-transparente-con-logo-lancarg.png" style="width:470px">
    <img class="pkg" id="p2" src="../../fotos/recortes/caja-abierta-png-con-logo-lancarg-fondo-transparente.png" style="width:400px">
    <img class="pkg" id="p3" src="../../fotos/recortes/pallet-con-paquetes-lancarg-fondo-transparente.png" style="width:370px">
    <div class="txt" style="top:1060px"><h1 data-in="0.35" style="font-size:104px">Comprá en Buenos Aires, <em>recibilo en <span style="white-space:nowrap">San Juan</span></em></h1>
      <div class="route" data-in="0.8">Buenos Aires <span class="arr">↔</span> San Juan</div></div>
  </div>
  <div class="scene" id="s3" data-start="6.8" data-end="10.2">
    <img class="bg" src="../../fotos/vertical/scania-cruzando-el-desierto.jpg"><div class="shade top"></div>
    <div class="txt" style="top:380px">
      <div class="li" data-in="0.3"><span class="dot">🚛</span>Camiones todos los días</div>
      <div class="li" data-in="0.75"><span class="dot">📦</span>Retiro a domicilio</div>
      <div class="li" data-in="1.2"><span class="dot">🛡️</span>Carga asegurada</div>
    </div>
  </div>
  <div class="scene green end" id="s4" data-start="10.2" data-end="14" data-nologo>
    <div class="logowrap"><img id="lgText" src="../../marca/logo-lancarg-sobre-verde.png"><img id="lgTruck" src="../../marca/logo-lancarg-sobre-verde.png"></div>
    <div class="pill" data-in="1.7"><span style="font-size:60px">📲</span><span>Cotizá por WhatsApp<small>264 454-3612</small></span></div>
  </div>
  <img id="toplogo" src="../../marca/logo-lancarg-sobre-verde.png">
</div>
<script>
// paquetes de la escena 2: entran volando y quedan flotando
// [id, demora, x inicial, x final, y, giro inicial, giro final]
const P = [["p1",0.0,-560,90,300,-18,-8],["p2",0.2,1140,580,280,24,10],["p3",0.4,-500,360,560,-20,0]];
// cierre: el camión del logo entra andando desde la izquierda y va "trayendo" el resto del logo detrás
const LOGO_W = 1540, TRUCK_X = 1170, SCALE = 760 / LOGO_W;
function logoDrive(t) {
  const lt = sceneTime(t, 's4'), x = cl((lt - 0.1) / 1.6), p = 1 - Math.pow(1 - x, 4), dx = -1500 * (1 - p);
  const moving = 1 - x;
  const truck = document.getElementById('lgTruck'), text = document.getElementById('lgText');
  truck.style.transform = `translateX(${dx}px) translateY(${Math.sin(lt * 38) * 4 * moving}px) rotate(${-1.2 * moving + 1.2 * Math.sin(cl((lt - 1.5) / 0.5) * Math.PI) * 0.8}deg)`;  // al frenar, la trompa baja un poco
  const edge = Math.min(LOGO_W, TRUCK_X + dx / SCALE);              // hasta dónde llegó la trompa del camión
  text.style.clipPath = `inset(0 ${Math.max(0, 100 - edge / LOGO_W * 100)}% 0 0)`;
  text.style.transform = `translateX(${Math.min(0, dx) * 0.04}px)`;
}
window.extra = function (t) {
  logoDrive(t);
  const lt = sceneTime(t, 's2');
  P.forEach(([id, dl, x0, x1, y, r0, r1], i) => {
    const p = eo((lt - dl) / 0.8), el = document.getElementById(id);
    el.style.left = (x0 + (x1 - x0) * p) + 'px'; el.style.top = (y + Math.sin((t + i * 1.3) * 2.2) * 14) + 'px';
    el.style.transform = `rotate(${r0 + (r1 - r0) * p}deg)`;
  });
};
</script>
<script src="../../plantillas/motion.js"></script>
</body></html>
