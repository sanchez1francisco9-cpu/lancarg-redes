<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../plantillas/motion.css">
</head><body>
<div id="stage">
  <div class="scene" id="s1" data-start="0" data-end="3.4">
    <img class="bg" src="../../fotos/vertical/camion-en-deposito-bsas.jpg"><div class="shade top"></div>
    <div class="txt" style="top:360px"><div class="kicker" data-in="0.3">Comercios y particulares</div>
      <h1 data-in="0.5">¿Comprás en <em>Buenos Aires</em>?</h1></div>
  </div>
  <div class="scene green" id="s2" data-start="3.4" data-end="6.8">
    <img class="pkg" id="p1" src="../../fotos/recortes/caja-png-con-fondo-transparente-con-logo-lancarg.png" style="width:470px">
    <img class="pkg" id="p3" src="../../fotos/recortes/pallet-con-paquetes-lancarg-fondo-transparente.png" style="width:370px">
    <img class="pkg" id="p2" src="../../fotos/recortes/caja-abierta-png-con-logo-lancarg-fondo-transparente.png" style="width:400px">
    <div class="txt" style="top:1060px"><h1 data-in="0.35" style="font-size:104px">Comprá en Buenos Aires, <em>recibilo en <span style="white-space:nowrap">San Juan</span></em></h1>
      <div class="route" data-in="0.8">Buenos Aires <span class="arr">↔</span> San Juan</div></div>
  </div>
  <div class="scene" id="s3" data-start="6.8" data-end="10.2">
    <img class="bg" src="../../fotos/vertical/scania-cruzando-el-desierto.jpg"><div class="shade top"></div>
    <div class="txt" style="top:380px">
      <div class="li" data-in="0.3"><span class="dot">🚛</span>Camiones todos los días</div>
      <div class="li" data-in="0.75"><span class="dot">📦</span>Retiro a domicilio</div>
      <div class="li" data-in="1.2"><span class="dot">🛡️</span>Carga asegurada</div>
    </div>
  </div>
  <div class="scene end white" id="s4" data-start="10.2" data-end="15.55" data-nologo>
    <div class="spacer"></div>
    <div class="pill" data-in="2.0"><span style="font-size:60px">📲</span><span>Cotizá por WhatsApp<small>264 454-3612</small></span></div>
  </div>
  <img id="toplogo" src="../../marca/logo-lancarg-sobre-verde.png">
</div>
<script>
// paquetes de la escena 2: entran volando y quedan flotando
// [id, demora, x inicial, x final, y, giro inicial, giro final]
const P = [["p1",0.0,-560,90,300,-18,-8],["p3",0.2,1140,630,250,20,0],["p2",0.4,-500,330,650,-24,6]];
// cierre: logo animado (se superpone al exportar)
window.OVERLAY = [{src: "../../marca/logo-lancarg-animado-horizontal.mp4", start: 10.55, x: 0, y: 563, w: 1080}];
window.extra = function (t) {
  const lt = sceneTime(t, 's2');
  P.forEach(([id, dl, x0, x1, y, r0, r1], i) => {
    const p = eo((lt - dl) / 0.8), el = document.getElementById(id);
    el.style.left = (x0 + (x1 - x0) * p) + 'px'; el.style.top = (y + Math.sin((t + i * 1.3) * 2.2) * 14) + 'px';
    el.style.transform = `rotate(${r0 + (r1 - r0) * p}deg)`;
  });
};
</script>
<script src="../../plantillas/motion.js"></script>
</body></html>
