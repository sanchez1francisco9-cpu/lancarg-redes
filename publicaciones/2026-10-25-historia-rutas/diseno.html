<script>
const NS='http://www.w3.org/2000/svg', R=document.getElementById('routes');
const SJ=[452,1054];
const C=[['Buenos Aires',[1280,1360],0.0,[0,46],-430],['Rosario',[1096,1195],0.35,[-30,58],190],['Córdoba',[807,1042],0.7,[10,58],-150]];
function mk(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||R).appendChild(e);return e;}
const labels=[];
const routes=C.map(([name,p,delay,off,h])=>{
  const mx=(p[0]+SJ[0])/2, my=(p[1]+SJ[1])/2, dx=SJ[0]-p[0], dy=SJ[1]-p[1], L=Math.hypot(dx,dy);
  const k=0.28*L, cx=mx+dy/L*k, cy=my-dx/L*k*(-1); // curva hacia arriba
  const ctrl=[mx, my+h];
  const d=`M${p[0]} ${p[1]} Q${ctrl[0]} ${ctrl[1]} ${SJ[0]} ${SJ[1]}`;
  mk('path',{d,class:'track'});
  const tr=mk('path',{d,class:'trail'});
  const len=tr.getTotalLength(); tr.style.strokeDasharray=len;
  const head=mk('path',{d:'M-22,-15 L18,0 L-22,15 L-12,0 Z',fill:'#E70A0F'});
  labels.push([name,p,off]);
  return {tr,len,head,delay};
});
labels.forEach(([name,p,off])=>{const g=mk('g',{class:'city'}); mk('circle',{cx:p[0],cy:p[1],r:13},g); const l=mk('text',{x:p[0]+off[0],y:p[1]+off[1],class:'lab','text-anchor':'middle'},g); l.textContent=name;});
// San Juan: pin con pulso
const sjg=mk('g',{});
const pulse=mk('circle',{cx:SJ[0],cy:SJ[1],r:20,fill:'none',stroke:'#E70A0F','stroke-width':5},sjg);
mk('circle',{cx:SJ[0],cy:SJ[1],r:20,fill:'#E70A0F'},sjg);
mk('circle',{cx:SJ[0],cy:SJ[1],r:8,fill:'#fff'},sjg);
const sl=mk('text',{x:SJ[0],y:SJ[1]+62,class:'lab sj','text-anchor':'middle'},sjg); sl.textContent='San Juan';
const cl=x=>Math.max(0,Math.min(1,x)), eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
window.DURATION=6;
window.render=function(t){
  const fade=1-cl((t-5.3)/0.6); // al final se borran los trazos para que el loop empalme
  routes.forEach(r=>{
    const p=eio((t-0.3-r.delay)/2.4);
    r.tr.style.strokeDashoffset=r.len*(1-p); r.tr.style.opacity=fade;
    const a=r.tr.getPointAtLength(r.len*p), b=r.tr.getPointAtLength(Math.min(r.len,r.len*p+2)), c0=r.tr.getPointAtLength(Math.max(0,r.len*p-2));
    const ang=Math.atan2(b.y-c0.y,b.x-c0.x)*180/Math.PI;
    r.head.setAttribute('transform',`translate(${a.x} ${a.y}) rotate(${ang})`);
    r.head.style.opacity=(p>0&&p<0.985?1:0)*fade;
  });
  const ph=(t%1.5)/1.5; pulse.setAttribute('r',20+40*ph); pulse.style.opacity=(1-ph)*0.8;
};
window.addEventListener('load',()=>render(0));
</script>
